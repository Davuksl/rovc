# RovC TURN Server — coturn configuration
# Deploy on a VPS with public UDP ports (DO NOT deploy on Render — no UDP support)
#
# Usage:
#   1. Install coturn: apt install coturn   (or docker, see docker-compose.yml)
#   2. Edit realm, server-name, user credentials below
#   3. Run: turnserver -c turnserver.conf
#
# General
listening-port = 3478
tls-listening-port = 5349
listening-ip = 0.0.0.0
relay-ip = 0.0.0.0
external-ip = YOUR_SERVER_IP       # ← CHANGE to your VPS public IP

# Performance
fingerprint
no-stdout-log
simple-log

# Auth — users connect with these credentials
lt-cred-mech
user = rovc:YOUR_SECRET_PASSWORD  # ← CHANGE password
realm = rovc.voice                # ← CHANGE realm
total-quota = 100
stale-nonce

# Relay ports (UDP range that must be open in firewall)
min-port = 49152
max-port = 65535

# Disable unwanted features
no-tlsv1
no-tlsv1_1
no-loopback-peers
no-multicast-peers
mobility
