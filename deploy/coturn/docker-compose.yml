# RovC TURN Server — Docker Compose
# Deploy on any VPS with public UDP access.
#
# Steps:
#   1. cp .env.example .env   # fill in IP and credentials
#   2. docker compose up -d
#   3. Open firewall: 3478/tcp, 3478/udp, 5349/tcp, 5349/udp, 49152-65535/udp

services:
  coturn:
    image: instrumentisto/coturn:latest
    container_name: rovc-turn
    restart: unless-stopped
    network_mode: host           # required for correct relay-ip detection
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
    environment:
      - DETECT_EXTERNAL_IP=yes   # auto-detect public IP if possible
